<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mouww — Friends</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #ffe8f4;
      --bg2: #eee5ff;
      --card: rgba(255,255,255,.82);
      --item: rgba(255,255,255,.72);
      --text: #30253a;
      --muted: #8d7896;
      --accent: #b978ff;
      --pink: #ff73b5;
      --green: #35b86a;
      --border: rgba(0,0,0,.06);
    }

    body.dark {
      --bg1: #100b18;
      --bg2: #21162d;
      --card: rgba(29,21,40,.92);
      --item: rgba(50,38,60,.92);
      --text: #fff5ff;
      --muted: #b9a9c0;
      --border: rgba(255,255,255,.08);
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,110,180,.35),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(135,100,255,.35),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          var(--bg1),
          var(--bg2)
        );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;

      background: var(--card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
    }

    @media (min-width:600px) {
      .app {
        min-height: 90vh;
        max-height: 900px;
        border-radius: 30px;
        overflow: hidden;

        box-shadow:
          0 25px 70px rgba(60,30,90,.22);
      }
    }

    /* Header */

    .header {
      height: 65px;

      padding: 0 15px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-bottom: 1px solid var(--border);
    }

    .back,
    .theme {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background: var(--item);
      color: var(--text);

      cursor: pointer;

      font-size: 19px;
    }

    .title {
      flex: 1;
      font-size: 20px;
      font-weight: bold;
    }

    /* Search */

    .search-area {
      padding: 13px 15px 8px;
    }

    .search {
      width: 100%;

      border: none;
      outline: none;

      border-radius: 18px;

      background: var(--item);
      color: var(--text);

      padding: 13px 15px;

      font-size: 14px;
    }

    .search::placeholder {
      color: var(--muted);
    }

    /* Tabs */

    .tabs {
      display: flex;

      padding: 7px 15px;

      gap: 7px;

      overflow-x: auto;
    }

    .tab {
      border: none;

      border-radius: 18px;

      padding: 9px 15px;

      background: var(--item);
      color: var(--muted);

      cursor: pointer;

      font-size: 12px;

      white-space: nowrap;
    }

    .tab.active {
      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--accent)
        );

      color: white;
    }

    /* Content */

    .content {
      flex: 1;

      overflow-y: auto;

      padding: 8px 15px 25px;
    }

    .section-title {
      color: var(--muted);

      font-size: 12px;

      margin: 10px 4px 8px;

      text-transform: uppercase;
    }

    /* Friend item */

    .friend {
      display: flex;
      align-items: center;

      gap: 11px;

      padding: 11px;

      margin-bottom: 8px;

      border-radius: 19px;

      background: var(--item);

      border: 1px solid var(--border);

      animation: itemIn .3s ease;
    }

    @keyframes itemIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .friend-avatar {
      width: 50px;
      height: 50px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #ff9dcc,
          #c19cff
        );

      font-size: 23px;

      flex-shrink: 0;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    .friend-info strong {
      display: block;

      font-size: 14px;

      margin-bottom: 4px;
    }

    .friend-info span {
      display: block;

      color: var(--muted);

      font-size: 11px;
    }

    .online {
      color: var(--green) !important;
    }

    /* Buttons */

    .friend-actions {
      display: flex;

      gap: 5px;

      flex-shrink: 0;
    }

    .btn {
      border: none;

      border-radius: 13px;

      padding: 8px 10px;

      font-size: 11px;

      cursor: pointer;
    }

    .follow {
      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--accent)
        );

      color: white;
    }

    .following {
      background: rgba(120,190,145,.18);
      color: var(--green);
    }

    .accept {
      background: var(--green);
      color: white;
    }

    .decline {
      background: rgba(255,95,120,.12);
      color: #ff5f78;
    }

    .message {
      background: var(--item);
      color: var(--text);

      border: 1px solid var(--border);
    }

    /* Empty */

    .empty {
      text-align: center;

      padding: 50px 20px;

      color: var(--muted);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 13px;
    }

    /* Toast */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translate(-50%,20px);

      opacity: 0;
      pointer-events: none;

      padding: 11px 17px;

      border-radius: 20px;

      background: rgba(30,20,40,.94);

      color: white;

      font-size: 12px;

      z-index: 20;

      transition: .3s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- Header -->

    <header class="header">

      <button
        class="back"
        onclick="goBack()"
      >
        ←
      </button>

      <div class="title">
        Friends 👥
      </div>

      <button
        class="theme"
        id="themeButton"
        onclick="toggleTheme()"
      >
        🌙
      </button>

    </header>


    <!-- Search -->

    <div class="search-area">

      <input
        class="search"
        id="search"
        type="search"
        placeholder="Search friends..."
        oninput="searchFriends()"
      >

    </div>


    <!-- Tabs -->

    <div class="tabs">

      <button
        class="tab active"
        onclick="showTab('friends', this)"
      >
        Friends
      </button>

      <button
        class="tab"
        onclick="showTab('requests', this)"
      >
        Requests
        <span id="requestCount">
          2
        </span>
      </button>

      <button
        class="tab"
        onclick="showTab('following', this)"
      >
        Following
      </button>

      <button
        class="tab"
        onclick="showTab('discover', this)"
      >
        Discover
      </button>

    </div>


    <!-- Content -->

    <section
      class="content"
      id="content"
    ></section>

  </main>


  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    const friends = [

      {
        name: "Ammu",
        username: "@ammu",
        avatar: "🌸",
        online: true,
        following: true
      },

      {
        name: "Arjun",
        username: "@arjun",
        avatar: "🎧",
        online: true,
        following: true
      },

      {
        name: "Maya",
        username: "@maya",
        avatar: "🦋",
        online: false,
        following: true
      }

    ];


    const requests = [

      {
        name: "Anu",
        username: "@anu",
        avatar: "🌷"
      },

      {
        name: "Riya",
        username: "@riya",
        avatar: "✨"
      }

    ];


    const discover = [

      {
        name: "Niya",
        username: "@niya",
        avatar: "🌙",
        following: false
      },

      {
        name: "Kevin",
        username: "@kevin",
        avatar: "🎮",
        following: false
      },

      {
        name: "Sara",
        username: "@sara",
        avatar: "🌺",
        following: false
      }

    ];


    let currentTab = "friends";


    /* Toast */

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 2200);
    }


    /* Render */

    function render() {

      const content =
        document.getElementById("content");

      content.innerHTML = "";


      if (currentTab === "friends") {

        renderFriends();

      } else if (currentTab === "requests") {

        renderRequests();

      } else if (currentTab === "following") {

        renderFollowing();

      } else {

        renderDiscover();
      }
    }


    /* Friends */

    function renderFriends() {

      if (friends.length === 0) {

        showEmpty(
          "👥",
          "You don't have any friends yet."
        );

        return;
      }


      const title =
        document.createElement("div");

      title.className =
        "section-title";

      title.textContent =
        "Your Friends";

      document
        .getElementById("content")
        .appendChild(title);


      friends.forEach((friend, index) => {

        createFriendCard(
          friend,
          index,
          "friends"
        );

      });
    }


    /* Requests */

    function renderRequests() {

      if (requests.length === 0) {

        showEmpty(
          "💗",
          "No friend requests right now."
        );

        return;
      }


      const title =
        document.createElement("div");

      title.className =
        "section-title";

      title.textContent =
        "Friend Requests";

      document
        .getElementById("content")
        .appendChild(title);


      requests.forEach((person,index) => {

        const card =
          document.createElement("div");

        card.className = "friend";

        card.innerHTML = `

          <div class="friend-avatar">
            ${person.avatar}
          </div>

          <div class="friend-info">

            <strong>
              ${person.name}
            </strong>

            <span>
              ${person.username}
            </span>

          </div>

          <div class="friend-actions">

            <button
              class="btn accept"
              onclick="acceptRequest(${index})"
            >
              Accept
            </button>

            <button
              class="btn decline"
              onclick="declineRequest(${index})"
            >
              ×
            </button>

          </div>
        `;

        document
          .getElementById("content")
          .appendChild(card);
      });
    }


    /* Following */

    function renderFollowing() {

      const following =
        friends.filter(
          friend => friend.following
        );

      if (following.length === 0) {

        showEmpty(
          "💗",
          "You're not following anyone yet."
        );

        return;
      }


      const title =
        document.createElement("div");

      title.className =
        "section-title";

      title.textContent =
        "Following";

      document
        .getElementById("content")
        .appendChild(title);


      following.forEach((friend,index) => {

        createFriendCard(
          friend,
          index,
          "following"
        );

      });
    }


    /* Discover */

    function renderDiscover() {

      const title =
        document.createElement("div");

      title.className =
        "section-title";

      title.textContent =
        "People You May Know";

      document
        .getElementById("content")
        .appendChild(title);


      discover.forEach((person,index) => {

        createFriendCard(
          person,
          index,
          "discover"
        );

      });
    }


    /* Card */

    function createFriendCard(
      person,
      index,
      type
    ) {

      const card =
        document.createElement("div");

      card.className = "friend";

      let statusText =
        person.online
          ? "● Online"
          : "Offline";

      let statusClass =
        person.online
          ? "online"
          : "";


      let buttonHTML = "";


      if (type === "friends") {

        buttonHTML = `

          <button
            class="btn message"
            onclick="openChat('${person.name}')"
          >
            💬
          </button>

        `;

      } else if (type === "following") {

        buttonHTML = `

          <button
            class="btn following"
            onclick="toggleFollowing(${index})"
          >
            Following
          </button>

        `;

      } else {

        buttonHTML = `

          <button
            class="btn follow"
            onclick="followPerson(${index})"
          >
            Follow
          </button>

        `;
      }


      card.innerHTML = `

        <div class="friend-avatar">
          ${person.avatar}
        </div>

        <div class="friend-info">

          <strong>
            ${person.name}
          </strong>

          <span>
            ${person.username}
          </span>

          <span class="${statusClass}">
            ${statusText}
          </span>

        </div>

        <div class="friend-actions">

          ${buttonHTML}

        </div>
      `;


      document
        .getElementById("content")
        .appendChild(card);
    }


    /* Empty */

    function showEmpty(icon,text) {

      document.getElementById(
        "content"
      ).innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ${icon}
          </div>

          <p>
            ${text}
          </p>

        </div>
      `;
    }


    /* Tabs */

    function showTab(tab,button) {

      currentTab = tab;

      document
        .querySelectorAll(".tab")
        .forEach(
          item => item.classList.remove("active")
        );

      button.classList.add("active");

      render();
    }


    /* Accept */

    function acceptRequest(index) {

      const person =
        requests[index];

      friends.push({

        name: person.name,
        username: person.username,
        avatar: person.avatar,
        online: false,
        following: true

      });


      requests.splice(index,1);

      updateRequestCount();

      render();

      showToast(
        `${person.name} is now your friend 💗`
      );
    }


    /* Decline */

    function declineRequest(index) {

      requests.splice(index,1);

      updateRequestCount();

      render();

      showToast(
        "Friend request declined"
      );
    }


    /* Follow */

    function followPerson(index) {

      const person =
        discover[index];

      person.following = true;

      friends.push({

        name: person.name,
        username: person.username,
        avatar: person.avatar,
        online: false,
        following: true

      });

      render();

      showToast(
        `Following ${person.name} 💗`
      );
    }


    /* Unfollow */

    function toggleFollowing(index) {

      const person =
        friends[index];

      person.following = false;

      render();

      showToast(
        `Unfollowed ${person.name}`
      );
    }


    /* Request count */

    function updateRequestCount() {

      document.getElementById(
        "requestCount"
      ).textContent =
        requests.length;
    }


    /* Search */

    function searchFriends() {

      const query =
        document.getElementById(
          "search"
        ).value
        .toLowerCase()
        .trim();


      if (!query) {

        render();

        return;
      }


      const all = [
        ...friends,
        ...requests,
        ...discover
      ];


      const results =
        all.filter(person =>
          person.name
            .toLowerCase()
            .includes(query) ||

          person.username
            .toLowerCase()
            .includes(query)
        );


      const content =
        document.getElementById(
          "content"
        );

      content.innerHTML = "";


      if (results.length === 0) {

        showEmpty(
          "🔎",
          "No users found."
        );

        return;
      }


      results.forEach((person,index) => {

        createSearchCard(person,index);

      });
    }


    function createSearchCard(person,index) {

      const card =
        document.createElement("div");

      card.className = "friend";

      card.innerHTML = `

        <div class="friend-avatar">
          ${person.avatar}
        </div>

        <div class="friend-info">

          <strong>
            ${person.name}
          </strong>

          <span>
            ${person.username}
          </span>

        </div>

        <div class="friend-actions">

          <button
            class="btn follow"
            onclick="showToast('Follow request sent 💗')"
          >
            Follow
          </button>

        </div>
      `;

      document
        .getElementById("content")
        .appendChild(card);
    }


    /* Chat */

    function openChat(name) {

      showToast(
        `Opening chat with ${name} 💬`
      );

      /*
        Later:

        window.location.href =
        "../chat/chat.html";
      */
    }


    /* Theme */

    function toggleTheme() {

      document.body.classList.toggle("dark");

      const dark =
        document.body.classList.contains("dark");

      document.getElementById(
        "themeButton"
      ).textContent =
        dark ? "☀️" : "🌙";

      localStorage.setItem(
        "mouww-theme",
        dark ? "dark" : "light"
      );
    }


    if (
      localStorage.getItem("mouww-theme")
      === "dark"
    ) {

      document.body.classList.add("dark");

      document.getElementById(
        "themeButton"
      ).textContent = "☀️";
    }


    /* Back */

    function goBack() {

      if (history.length > 1) {

        history.back();

      } else {

        showToast(
          "Home page will be connected later 🏠"
        );
      }
    }


    render();

  </script>

</body>
</html>
