<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mouww AI 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #ffe8f4;
      --bg2: #eee5ff;
      --card: rgba(255,255,255,.78);
      --text: #30253a;
      --muted: #8c7894;
      --input: rgba(255,255,255,.75);
      --ai: #ffffff;
      --user: linear-gradient(135deg,#d68cff,#a875ff);
      --accent: #c47dff;
      --border: rgba(0,0,0,.06);
    }

    body.dark {
      --bg1: #100b18;
      --bg2: #21162d;
      --card: rgba(29,21,39,.9);
      --text: #fff6ff;
      --muted: #b8a9bf;
      --input: rgba(50,38,60,.95);
      --ai: #30243a;
      --border: rgba(255,255,255,.08);
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(circle at 10% 10%,
          rgba(255,110,180,.38),
          transparent 28%),
        radial-gradient(circle at 90% 90%,
          rgba(130,100,255,.35),
          transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* Background animation */

    .orb {
      position: fixed;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .45;
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
    }

    .orb.one {
      background: #ff77b9;
      top: -100px;
      left: -90px;
    }

    .orb.two {
      background: #9470ff;
      bottom: -100px;
      right: -90px;
      animation-delay: 2s;
    }

    @keyframes float {
      from {
        transform: translate(0,0) scale(1);
      }

      to {
        transform: translate(45px,35px) scale(1.2);
      }
    }

    /* App */

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 900px;

      background: var(--card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      display: flex;
      flex-direction: column;

      position: relative;
      z-index: 2;
    }

    @media (min-width:600px) {
      .app {
        height: 92vh;
        border-radius: 30px;
        overflow: hidden;

        box-shadow:
          0 25px 70px rgba(60,30,90,.22);
      }
    }

    /* Header */

    .header {
      padding: 15px 16px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 50px;
      height: 50px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      background:
        linear-gradient(135deg,#ff9dcc,#c6a5ff);

      box-shadow:
        0 7px 20px rgba(180,100,210,.25);

      flex-shrink: 0;
    }

    .header-info {
      flex: 1;
    }

    .header-info h1 {
      font-size: 18px;
      margin-bottom: 3px;
    }

    .online {
      font-size: 12px;
      color: #38b86a;
    }

    .header-btn {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 50%;

      background: var(--input);
      color: var(--text);

      cursor: pointer;
      font-size: 18px;
    }

    /* Chat */

    .chat {
      flex: 1;
      overflow-y: auto;

      padding: 18px 15px 10px;

      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(160,120,180,.35);
      border-radius: 10px;
    }

    .message-row {
      display: flex;
      margin-bottom: 13px;

      animation: messageIn .25s ease;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message {
      max-width: 82%;
      padding: 11px 13px;

      border-radius: 18px;

      line-height: 1.45;
      font-size: 14px;

      position: relative;
      word-wrap: break-word;
    }

    .ai-message {
      background: var(--ai);
      border-bottom-left-radius: 5px;

      box-shadow:
        0 4px 15px rgba(0,0,0,.06);
    }

    .user-message {
      color: white;
      background: var(--user);
      border-bottom-right-radius: 5px;

      box-shadow:
        0 5px 18px rgba(140,90,220,.2);
    }

    .message-time {
      display: block;
      margin-top: 5px;

      font-size: 9px;
      opacity: .55;
      text-align: right;
    }

    /* Message actions */

    .message-actions {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }

    .copy-btn {
      border: none;
      background: transparent;

      color: var(--muted);

      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .copy-btn:hover {
      color: var(--accent);
    }

    /* Image message */

    .uploaded-image {
      max-width: 220px;
      max-height: 260px;

      display: block;

      border-radius: 14px;

      margin-top: 4px;
    }

    /* Typing */

    .typing {
      display: none;
      align-items: center;
      gap: 5px;

      width: fit-content;

      padding: 12px 15px;

      border-radius: 18px;
      border-bottom-left-radius: 5px;

      background: var(--ai);

      box-shadow:
        0 4px 15px rgba(0,0,0,.06);

      margin-bottom: 12px;
    }

    .typing.show {
      display: flex;
    }

    .dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #aa7ad1;

      animation: typingDot 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typingDot {
      0%,60%,100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* Input */

    .input-area {
      padding: 10px 12px 12px;

      border-top: 1px solid var(--border);

      background: var(--card);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .message-input {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      padding: 13px 15px;

      border-radius: 25px;

      background: var(--input);
      color: var(--text);

      font-size: 14px;
    }

    .message-input::placeholder {
      color: var(--muted);
    }

    .tool-btn,
    .send-btn {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: none;
      border-radius: 50%;

      cursor: pointer;

      font-size: 18px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn {
      background: var(--input);
      color: var(--text);
    }

    .send-btn {
      color: white;

      background:
        linear-gradient(135deg,#d17fff,#9b70ff);

      box-shadow:
        0 7px 18px rgba(150,90,220,.25);
    }

    .send-btn:active,
    .tool-btn:active,
    .header-btn:active {
      transform: scale(.92);
    }

    /* File input */

    #imageInput {
      display: none;
    }

    /* Preview */

    .preview {
      display: none;

      padding: 7px 0;

      position: relative;
    }

    .preview.show {
      display: block;
    }

    .preview img {
      width: 70px;
      height: 70px;

      object-fit: cover;

      border-radius: 12px;
    }

    .remove-preview {
      position: absolute;

      top: 1px;
      left: 58px;

      width: 22px;
      height: 22px;

      border: none;
      border-radius: 50%;

      background: #ff5f78;
      color: white;

      cursor: pointer;
    }

    /* Toast */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translate(-50%,20px);

      opacity: 0;
      pointer-events: none;

      padding: 11px 17px;

      border-radius: 20px;

      background: rgba(30,20,40,.93);
      color: white;

      font-size: 12px;

      z-index: 20;

      transition: .3s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>


  <main class="app">

    <!-- Header -->

    <header class="header">

      <div class="avatar">
        🎀
      </div>

      <div class="header-info">

        <h1>
          Mouww 💗
        </h1>

        <span class="online">
          ● Online
        </span>

      </div>

      <button
        class="header-btn"
        onclick="toggleTheme()"
        id="themeBtn"
        title="Theme"
      >
        🌙
      </button>

    </header>


    <!-- Chat -->

    <section
      class="chat"
      id="chat"
    >

      <div class="message-row">

        <div class="message ai-message">

          Chuchu 🥹💗<br>

          Ninak entha patiye?
          Parayoo... Mouww ivide undallo 🫂✨

          <span class="message-time">
            Now
          </span>

          <div class="message-actions">

            <button
              class="copy-btn"
              onclick="copyText(this)"
              data-copy="Chuchu 🥹💗 Ninak entha patiye? Parayoo... Mouww ivide undallo 🫂✨"
            >
              📋 Copy
            </button>

          </div>

        </div>

      </div>


      <!-- Typing -->

      <div
        class="typing"
        id="typing"
      >

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

    </section>


    <!-- Input -->

    <footer class="input-area">

      <!-- Image preview -->

      <div
        class="preview"
        id="preview"
      >

        <img
          id="previewImage"
          alt="Selected image"
        >

        <button
          class="remove-preview"
          onclick="removeImage()"
        >
          ×
        </button>

      </div>


      <div class="input-row">

        <!-- Upload -->

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          onchange="previewImage(event)"
        >

        <button
          class="tool-btn"
          onclick="document.getElementById('imageInput').click()"
          title="Upload image"
        >
          🖼️
        </button>


        <!-- Message -->

        <input
          class="message-input"
          id="messageInput"
          type="text"
          placeholder="Message Mouww..."
          autocomplete="off"
          onkeydown="handleKey(event)"
        >


        <!-- Send -->

        <button
          class="send-btn"
          onclick="sendMessage()"
          title="Send"
        >
          ➤
        </button>

      </div>

    </footer>

  </main>


  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    let selectedImage = null;


    /* Theme */

    function toggleTheme() {

      document.body.classList.toggle("dark");

      const dark =
        document.body.classList.contains("dark");

      document.getElementById("themeBtn")
        .textContent = dark ? "☀️" : "🌙";

      localStorage.setItem(
        "mouww-chat-theme",
        dark ? "dark" : "light"
      );
    }


    /* Restore theme */

    if (
      localStorage.getItem("mouww-chat-theme")
      === "dark"
    ) {

      document.body.classList.add("dark");

      document.getElementById("themeBtn")
        .textContent = "☀️";
    }


    /* Time */

    function getTime() {

      return new Date().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    /* Escape text */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    /* Add text message */

    function addUserMessage(text) {

      const chat =
        document.getElementById("chat");

      const row =
        document.createElement("div");

      row.className =
        "message-row user-row";

      const message =
        document.createElement("div");

      message.className =
        "message user-message";

      const safeText =
        escapeHTML(text)
          .replace(/\n/g, "<br>");

      message.innerHTML = `
        ${safeText}

        <span class="message-time">
          ${getTime()}
        </span>

        <div class="message-actions">

          <button
            class="copy-btn"
            onclick="copyText(this)"
            data-copy="${escapeHTML(text)}"
          >
            📋 Copy
          </button>

        </div>
      `;

      row.appendChild(message);

      chat.insertBefore(
        row,
        document.getElementById("typing")
      );

      scrollChat();
    }


    /* Add image */

    function addImageMessage(src) {

      const chat =
        document.getElementById("chat");

      const row =
        document.createElement("div");

      row.className =
        "message-row user-row";

      const message =
        document.createElement("div");

      message.className =
        "message user-message";

      message.innerHTML = `

        <img
          class="uploaded-image"
          src="${src}"
          alt="Uploaded image"
        >

        <span class="message-time">
          ${getTime()}
        </span>

        <div class="message-actions">

          <button
            class="copy-btn"
            onclick="showToast('Image message 💗')"
          >
            📋 Copy
          </button>

        </div>
      `;

      row.appendChild(message);

      chat.insertBefore(
        row,
        document.getElementById("typing")
      );

      scrollChat();
    }


    /* Send */

    function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();


      if (!text && !selectedImage) {

        showToast(
          "Type a message or choose an image 💗"
        );

        return;
      }


      if (text) {

        addUserMessage(text);

        input.value = "";
      }


      if (selectedImage) {

        addImageMessage(selectedImage);

        removeImage();
      }


      /*
        API connection will be added later.

        For now this is UI/demo mode.
      */

      showTyping();

      setTimeout(() => {

        hideTyping();

        addAIMessage(
          "Mouww received your message 💗✨ API connection will be added later."
        );

      }, 850);
    }


    /* AI message */

    function addAIMessage(text) {

      const chat =
        document.getElementById("chat");

      const row =
        document.createElement("div");

      row.className =
        "message-row";

      const message =
        document.createElement("div");

      message.className =
        "message ai-message";

      message.innerHTML = `

        ${escapeHTML(text)}

        <span class="message-time">
          ${getTime()}
        </span>

        <div class="message-actions">

          <button
            class="copy-btn"
            onclick="copyText(this)"
            data-copy="${escapeHTML(text)}"
          >
            📋 Copy
          </button>

        </div>
      `;

      row.appendChild(message);

      chat.insertBefore(
        row,
        document.getElementById("typing")
      );

      scrollChat();
    }


    /* Enter */

    function handleKey(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
      }
    }


    /* Typing */

    function showTyping() {

      document
        .getElementById("typing")
        .classList.add("show");

      scrollChat();
    }


    function hideTyping() {

      document
        .getElementById("typing")
        .classList.remove("show");
    }


    /* Scroll */

    function scrollChat() {

      const chat =
        document.getElementById("chat");

      setTimeout(() => {

        chat.scrollTop =
          chat.scrollHeight;

      }, 30);
    }


    /* Copy */

    async function copyText(button) {

      const text =
        button.getAttribute("data-copy");

      try {

        await navigator.clipboard.writeText(
          text
        );

        showToast(
          "Message copied 📋💗"
        );

      } catch {

        showToast(
          "Copy not available"
        );
      }
    }


    /* Image preview */

    function previewImage(event) {

      const file =
        event.target.files[0];

      if (!file) return;


      if (!file.type.startsWith("image/")) {

        showToast(
          "Please select an image 🖼️"
        );

        return;
      }


      const reader =
        new FileReader();

      reader.onload = function(e) {

        selectedImage =
          e.target.result;

        document.getElementById(
          "previewImage"
        ).src = selectedImage;

        document.getElementById(
          "preview"
        ).classList.add("show");
      };

      reader.readAsDataURL(file);
    }


    /* Remove image */

    function removeImage() {

      selectedImage = null;

      document.getElementById(
        "imageInput"
      ).value = "";

      document.getElementById(
        "preview"
      ).classList.remove("show");
    }


    /* Toast */

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 2200);
    }

  </script>

</body>
</html>
