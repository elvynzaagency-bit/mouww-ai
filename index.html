<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mouww AI 💗</title>

<style>
*{box-sizing:border-box}

:root{
  --pink:#ff79b8;
  --purple:#a978ff;
  --glass:rgba(255,255,255,.72);
  --text:#33263a;
  --muted:#8b718f;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 20%,#ffd4ea,transparent 30%),
    radial-gradient(circle at 90% 80%,#d8c4ff,transparent 30%),
    linear-gradient(135deg,#ffe8f3,#eee4ff);
}

/* Animated background */
body::before,
body::after{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  filter:blur(60px);
  opacity:.45;
  animation:float 8s ease-in-out infinite alternate;
  pointer-events:none;
}

body::before{
  background:#ff8fc9;
  top:-80px;
  left:-80px;
}

body::after{
  background:#9d7cff;
  bottom:-100px;
  right:-80px;
  animation-delay:2s;
}

@keyframes float{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(40px,30px) scale(1.2)}
}

.app{
  position:relative;
  width:100%;
  max-width:500px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:var(--glass);
  backdrop-filter:blur(25px);
  overflow:hidden;
}

/* Header */
.header{
  position:relative;
  padding:16px;
  text-align:center;
  border-bottom:1px solid rgba(0,0,0,.06);
}

.menu-btn{
  position:absolute;
  left:14px;
  top:18px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  cursor:pointer;
  font-size:20px;
}

.settings-btn{
  position:absolute;
  right:14px;
  top:18px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  cursor:pointer;
  font-size:19px;
}

.avatar{
  width:76px;
  height:76px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:linear-gradient(135deg,#ff9ecb,#c9a7ff);
  box-shadow:0 8px 30px rgba(180,110,190,.3);
  animation:avatarPulse 3s ease-in-out infinite;
}

@keyframes avatarPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

h1{
  margin:8px 0 2px;
  font-size:24px;
}

.status{
  color:var(--muted);
  font-size:12px;
}

/* Modes */
.mode-selector{
  display:flex;
  gap:7px;
  padding:10px 14px;
  justify-content:center;
}

.mode{
  flex:1;
  max-width:120px;
  border:0;
  padding:9px 10px;
  border-radius:20px;
  background:#f3e8f8;
  color:#6d4b78;
  cursor:pointer;
  transition:.25s;
}

.mode:hover{
  transform:translateY(-2px);
}

.mode.active{
  color:white;
  background:linear-gradient(135deg,#ff82bd,#a979ff);
  box-shadow:0 5px 18px rgba(190,120,220,.3);
}

/* Chat */
.chat{
  flex:1;
  overflow-y:auto;
  padding:18px;
  scroll-behavior:smooth;
}

.message{
  max-width:84%;
  padding:12px 15px;
  margin-bottom:12px;
  border-radius:18px;
  line-height:1.5;
  font-size:15px;
  animation:messageIn .3s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.ai{
  background:rgba(255,255,255,.9);
  border-bottom-left-radius:5px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.user{
  margin-left:auto;
  background:linear-gradient(135deg,#dca8ff,#ff91c6);
  color:white;
  border-bottom-right-radius:5px;
}

/* Typing */
.typing{
  display:none;
  width:max-content;
  background:white;
  padding:10px 14px;
  border-radius:18px;
  margin-bottom:12px;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin:0 2px;
  border-radius:50%;
  background:#c18cff;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-6px)}
}

/* Input */
.input-area{
  display:flex;
  gap:8px;
  padding:13px;
  background:rgba(255,255,255,.78);
  border-top:1px solid rgba(0,0,0,.06);
}

input{
  flex:1;
  border:0;
  outline:0;
  padding:13px 16px;
  border-radius:25px;
  background:#f6eff8;
  font-size:15px;
}

.send-button{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#d18cff,#ff80bb);
  color:white;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(190,110,210,.3);
}

.send-button:active{
  transform:scale(.92);
}

/* Side menu */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(30,15,40,.3);
  backdrop-filter:blur(3px);
  display:none;
  z-index:20;
}

.overlay.show{display:block}

.side-menu{
  position:fixed;
  left:-310px;
  top:0;
  bottom:0;
  width:290px;
  padding:22px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(25px);
  z-index:21;
  transition:.3s ease;
  box-shadow:10px 0 35px rgba(50,20,70,.15);
}

.side-menu.open{
  left:0;
}

.menu-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.menu-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff9ecb,#c9a7ff);
  font-size:27px;
}

.menu-item{
  width:100%;
  border:0;
  background:transparent;
  padding:14px;
  margin:4px 0;
  border-radius:14px;
  text-align:left;
  font-size:15px;
  color:#49364f;
  cursor:pointer;
}

.menu-item:hover{
  background:#f7edf9;
}

.upgrade{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  color:white;
  background:linear-gradient(135deg,#a875ff,#ff78b8);
  box-shadow:0 8px 25px rgba(170,100,220,.25);
}

.upgrade button{
  margin-top:10px;
  width:100%;
  border:0;
  padding:11px;
  border-radius:20px;
  background:white;
  color:#8b58bd;
  font-weight:bold;
  cursor:pointer;
}

/* Settings */
.settings-panel{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(30,15,40,.3);
  backdrop-filter:blur(4px);
  z-index:30;
}

.settings-panel.show{
  display:flex;
}

.settings-box{
  width:100%;
  max-width:500px;
  padding:22px;
  border-radius:25px 25px 0 0;
  background:rgba(255,255,255,.96);
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.close-settings{
  border:0;
  background:#f3e8f8;
  padding:9px 15px;
  border-radius:18px;
  cursor:pointer;
}

@media(min-width:600px){
  .app{
    height:92vh;
    border-radius:30px;
    box-shadow:0 25px 70px rgba(70,30,100,.2);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="menu-btn" onclick="openMenu()">☰</button>

    <button class="settings-btn" onclick="openSettings()">⚙️</button>

    <div class="avatar">🎀</div>

    <h1>Mouww 💗</h1>

    <div class="status">
      Your cute AI companion ✨
    </div>

  </div>

  <div class="mode-selector">

    <button class="mode active"
      onclick="setMode('free')">
      🟢 Free
    </button>

    <button class="mode"
      onclick="setMode('manual')">
      🔵 Manual
    </button>

    <button class="mode"
      onclick="setMode('pro')">
      🟣 Pro
    </button>

  </div>

  <div class="chat" id="chat">

    <div class="message ai">
      Chuchu 🥹 Ninak ntha patye?<br>
      Parayoo… Mouww ivide undallo 🫂💗
    </div>

    <div class="typing" id="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Chuchu, type something..."
      onkeydown="handleKey(event)"
    >

    <button
      class="send-button"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<!-- Side menu -->

<div class="overlay"
     id="overlay"
     onclick="closeMenu()">
</div>

<div class="side-menu" id="sideMenu">

  <div class="menu-title">

    <div class="menu-avatar">
      🎀
    </div>

    <div>
      <strong>Mouww AI</strong>
      <div class="status">
        Your AI companion
      </div>
    </div>

  </div>

  <button class="menu-item"
          onclick="newChat()">
    💬 New Chat
  </button>

  <button class="menu-item"
          onclick="clearChat()">
    🧹 Clear Chat
  </button>

  <button class="menu-item"
          onclick="openSettings()">
    ⚙️ Settings
  </button>

  <button class="menu-item">
    👤 Profile
  </button>

  <button class="menu-item">
    💳 Payment & Plans
  </button>

  <div class="upgrade">

    <strong>✨ Mouww Pro</strong>

    <p>
      Unlock faster AI and premium features.
    </p>

    <button onclick="selectPro()">
      Upgrade to Pro
    </button>

  </div>

</div>


<!-- Settings -->

<div class="settings-panel"
     id="settingsPanel">

  <div class="settings-box">

    <div style="display:flex;justify-content:space-between;align-items:center">

      <h2>⚙️ Settings</h2>

      <button
        class="close-settings"
        onclick="closeSettings()">
        ✕
      </button>

    </div>

    <div class="setting-row">
      <span>✨ AI animations</span>
      <input type="checkbox" checked>
    </div>

    <div class="setting-row">
      <span>🔔 Notifications</span>
      <input type="checkbox">
    </div>

    <div class="setting-row">
      <span>🌙 Dark mode</span>
      <input type="checkbox">
    </div>

  </div>

</div>


<script src="https://YOUR-PROJECT.supabase.co"></script>

<script>

const SUPABASE_URL =
  "https://YOUR-PROJECT.supabase.co";

const SUPABASE_ANON_KEY =
  "YOUR_EXISTING_SUPABASE_ANON_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let currentMode = "free";


function setMode(mode){

  currentMode = mode;

  document
    .querySelectorAll(".mode")
    .forEach(button=>{
      button.classList.remove("active");
    });

  const selected =
    document.querySelector(
      `.mode[onclick="setMode('${mode}')"]`
    );

  if(selected){
    selected.classList.add("active");
  }

  addMessage(
    mode === "free"
      ? "🟢 Free mode activated 💗"
      : mode === "manual"
      ? "🔵 Manual mode activated 💙"
      : "🟣 Pro mode activated 💜",
    "ai"
  );
}


function showTyping(){

  document.getElementById("typing")
    .style.display="block";

  const chat =
    document.getElementById("chat");

  chat.scrollTop =
    chat.scrollHeight;
}


function hideTyping(){

  document.getElementById("typing")
    .style.display="none";
}


function addMessage(text,type){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


async function initMouwwAuth(){

  const {
    data:{session}
  } =
    await supabaseClient.auth.getSession();

  if(!session){

    const {error} =
      await supabaseClient.auth
        .signInAnonymously();

    if(error){
      console.error(
        "Mouww auth error:",
        error
      );
    }
  }
}

initMouwwAuth();


async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(
    text,
    "user"
  );

  input.value="";

  showTyping();

  try{

    const {
      data:{session}
    } =
      await supabaseClient.auth
        .getSession();

    const response =
      await fetch(
        "https://YOUR-PROJECT.supabase.co/functions/v1/rapid-worker",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${
                session?.access_token || ""
              }`,

            "apikey":
              SUPABASE_ANON_KEY
          },

          body:JSON.stringify({
            message:text,
            mode:currentMode
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data?.error ||
        "AI request failed"
      );
    }

    const reply =
      data?.reply ||
      data?.choices?.[0]
        ?.message?.content ||
      data?.choices?.[0]
        ?.text ||
      "Mouww couldn't generate a reply.";

    hideTyping();

    addMessage(
      reply,
      "ai"
    );

  }catch(error){

    console.error(
      "Mouww AI error:",
      error
    );

    hideTyping();

    addMessage(
      "Ayyoo 🥹 Mouww-kku ippol oru small AI connection problem undu 💗",
      "ai"
    );
  }
}


function handleKey(event){

  if(event.key==="Enter"){
    sendMessage();
  }
}


function openMenu(){

  document
    .getElementById("sideMenu")
    .classList.add("open");

  document
    .getElementById("overlay")
    .classList.add("show");
}


function closeMenu(){

  document
    .getElementById("sideMenu")
    .classList.remove("open");

  document
    .getElementById("overlay")
    .classList.remove("show");
}


function openSettings(){

  closeMenu();

  document
    .getElementById("settingsPanel")
    .classList.add("show");
}


function closeSettings(){

  document
    .getElementById("settingsPanel")
    .classList.remove("show");
}


function clearChat(){

  const chat =
    document.getElementById("chat");

  chat.innerHTML=`
    <div class="message ai">
      Chat cleared 💗<br>
      Chuchu, Mouww ivide undu 🫂✨
    </div>

    <div class="typing" id="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  closeMenu();
}


function newChat(){

  clearChat();
}


function selectPro(){

  setMode("pro");

  closeMenu();

  addMessage(
    "🟣 Pro mode selected! 💜 Payment integration can be connected next.",
    "ai"
  );
}

</script>

</body>
</html>
